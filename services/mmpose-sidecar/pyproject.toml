[project]
name = "ai-bead-mmpose-sidecar"
version = "0.1.0"
description = "Pinned RTMPose-M AP-10K keypoint provider for AI Bead Pattern"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx2==2.12.0",
  "numpy==2.2.6",
  "onnxruntime==1.23.2",
  "opencv-python-headless==4.12.0.88",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmpose_sidecar"]
