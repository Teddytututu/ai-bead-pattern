[project]
name = "ai-bead-sdxl-region-sidecar"
version = "0.1.0"
description = "Full-canvas SDXL inpainting with bounded bead-grid edits and optional LoRA"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.10.1",
  "diffusers==0.35.2",
  "fastapi==0.116.1",
  "huggingface-hub==0.35.3",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "pillow==11.3.0",
  "peft==0.17.1",
  "pydantic==2.11.9",
  "safetensors==0.6.2",
  "torch==2.8.0",
  "transformers==4.56.2",
  "uvicorn==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdxl_region_sidecar"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
