[project]
name = "ai-bead-sam2-sidecar"
version = "0.1.0"
description = "Pinned SAM 2.1 Hiera Small prompted segmentation for AI Bead Pattern"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "hf-xet==1.6.0",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==5.16.1",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam2_sidecar"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
