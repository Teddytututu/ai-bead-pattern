<g filter="url(#shadow)"><rect x="972" y="187" width="264" height="155" rx="18" fill="white" stroke="#DCE7E9"/></g><rect x="972" y="187" width="264" height="7" rx="3.5" fill="#D9933D"/><circle cx="1006" cy="229" r="19" fill="#D9933D"/><text class="num" x="995" y="235">04</text><text class="t cardTitle" x="1035" y="237">核心生成</text><text class="t body" x="995" y="283">Pattern Core 规划与制图</text><text class="t body" x="995" y="309">接入冻结版本的材料色板</text>
