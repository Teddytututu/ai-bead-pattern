<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI 拼豆图纸项目：模块与算法流程</title><desc id="desc">项目从图片与生成参数进入 Web Demo 或微信小程序，经任务调度、可选视觉分析和人工修正，进入 Pattern Core 的画布、特征、结构、明暗、色板、网格精修和评分七阶段，最后交付候选图纸与导出文件。</desc>
