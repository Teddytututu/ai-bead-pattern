<text x="140" y="234.88" font-size="17.64" fill="#263747" text-anchor="middle" class="mono">H</text>
<rect x="161" y="208" width="42" height="42" fill="#409da6" stroke="#8ca0ac" stroke-width="1"/>
<text x="182" y="234.88" font-size="17.64" fill="#fff" text-anchor="middle" class="mono">I</text>
<rect x="203" y="208" width="42" height="42" fill="#273449" stroke="#8ca0ac" stroke-width="1"/>
<text x="224" y="234.88" font-size="17.64" fill="#fff" text-anchor="middle" class="mono">D</text>
