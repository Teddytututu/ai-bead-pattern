<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
<title id="title">眼、鼻、嘴角色以及空白、白珠、保留底色的区别</title>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .mono{font-family:Consolas,monospace}</style>
<rect x="0" y="0" width="1200" height="780" fill="#edf3f7" />
<text x="36" y="47" font-size="29" fill="#193447" >角色参考：看功能，不只看颜色</text>
<text x="36" y="80" font-size="17" fill="#526b7b" >下列形状是教学示例；真实图纸可以更小、更大、不对称、闭眼或缺失。</text>
<rect x="24" y="106" width="274" height="352" fill="#fff" rx="14"/>
<text x="42" y="142" font-size="20" fill="#193447" >睁眼：4 × 4</text>
<rect x="77" y="166" width="42" height="42" fill="#edc3a8" stroke="#8ca0ac" stroke-width="1"/>
<text x="98" y="192.88" font-size="17.64" fill="#263747" text-anchor="middle" class="mono">.</text>
<rect x="119" y="166" width="42" height="42" fill="#273449" stroke="#8ca0ac" stroke-width="1"/>
<text x="140" y="192.88" font-size="17.64" fill="#fff" text-anchor="middle" class="mono">D</text>
<rect x="161" y="166" width="42" height="42" fill="#273449" stroke="#8ca0ac" stroke-width="1"/>
