<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼豆图纸数据集</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f3f8;color:#17253b;font:15px/1.6 system-ui,sans-serif}header{padding:26px 4%;background:#172b46;color:white}h1{margin:0}p{margin:6px 0}main{padding:22px 4%}input,select,button{padding:10px;border:1px solid #acbbcc;border-radius:8px;margin:0 8px 12px 0;font:inherit;background:white}input{min-width:220px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 9px #26344912}.card img{width:100%;aspect-ratio:1.56;object-fit:contain;background:white}.detail{padding:14px}h3{margin:0 0 8px;font-size:16px}a{color:#126aaa}.badge{font-size:13px;color:#48705b}.muted{font-size:12px;color:#657387}#count{padding:0 0 15px}.tools{position:sticky;top:0;background:#f0f3f8ed;padding-top:8px;z-index:2}.nav{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:10px 0}.stats{font-size:20px;margin:12px 0;color:#abedd5}header a{color:#abedd5}
</style>
<header><h1>拼豆图纸数据集</h1><div class="stats" id="stats"></div><p>动漫脸部优先 · 原图与署名保留 · 2026-09-29</p><p>“候选”由标题和来源标签筛选；“已核对”经过缩略图检查。授权与训练标注仍待补齐。</p><p><a href="README.md">数据说明</a> · <a href="manifest.json">完整 JSON</a> · <a href="dataset.sqlite3">SQLite 数据库</a> · <a href="anime-face-candidates.json">脸部优先候选集</a></p></header>
<main><div class="tools"><input id="query" placeholder="搜索角色、标题、作者或标签" aria-label="搜索"><select id="category" aria-label="大类"><option value="">全部大类</option><option value="anime">动漫人物</option><option value="animal">动物</option></select><select id="focus" aria-label="题材"><option value="">全部题材</option><option value="face-priority">动漫脸部／眼部优先</option></select><select id="review" aria-label="核对状态"><option value="">全部核对状态</option><option value="reviewed">缩略图已核对</option><option value="pending">待目视审核</option></select><div id="count" aria-live="polite"></div><div class="nav"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><select id="size" aria-label="每页数量"><option>36</option><option selected>72</option><option>144</option></select></div></div><div id="cards"></div></main>
<script>
const rows=PAYLOAD;
const names={face:'动漫脸部／头像 · 已核对',eyes:'动漫眼部 · 已核对',character:'动漫人物 · 已核对','animal-face':'动物头像 · 已核对',animal:'动物 · 已核对','face-candidate':'动漫脸部候选','eyes-candidate':'动漫眼部候选','character-candidate':'动漫人物候选','animal-face-candidate':'动物头像候选','animal-candidate':'动物候选'};
const faceTypes=new Set(['face','eyes','face-candidate','eyes-candidate']);
const q=document.querySelector('#query'),f=document.querySelector('#focus'),c=document.querySelector('#category'),v=document.querySelector('#review'),cards=document.querySelector('#cards'),size=document.querySelector('#size'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
let pageNumber=0;
const ordered=rows.map(r=>({...r,search:JSON.stringify([r.title,r.author,r.tagsText,r.discoveryQuery]).toLowerCase()})).sort((a,b)=>a.priority-b.priority||(a.visualReview==='pending')-(b.visualReview==='pending')||(b.likes||0)-(a.likes||0));
document.querySelector('#stats').textContent=`${rows.length.toLocaleString()} 张原图 · ${rows.filter(r=>r.category==='anime').length.toLocaleString()} 张动漫 · ${rows.filter(r=>r.category==='animal').length.toLocaleString()} 张动物`;
for(const key of [...new Set(rows.map(r=>r.focus))]){const o=document.createElement('option');o.value=key;o.textContent=names[key]||key;f.append(o)}
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function render(reset=false){if(reset)pageNumber=0;cards.replaceChildren();const shown=ordered.filter(r=>(!f.value||(f.value==='face-priority'?faceTypes.has(r.focus):r.focus===f.value))&&(!c.value||r.category===c.value)&&(!v.value||(v.value==='pending'?r.visualReview==='pending':r.visualReview!=='pending'))&&(!q.value||r.search.includes(q.value.toLowerCase())));const n=Number(size.value),pages=Math.max(1,Math.ceil(shown.length/n));pageNumber=Math.max(0,Math.min(pageNumber,pages-1));const start=pageNumber*n,visible=shown.slice(start,start+n);document.querySelector('#count').textContent=`匹配 ${shown.length.toLocaleString()} / ${rows.length.toLocaleString()} 张 · 显示 ${shown.length?start+1:0}–${start+visible.length}`;document.querySelector('#count').dataset.matched=shown.length;document.querySelector('#page').textContent=`第 ${pageNumber+1} / ${pages} 页`;prev.disabled=pageNumber===0;next.disabled=pageNumber>=pages-1;
for(const r of visible){const card=el('article',null,'card');card.dataset.id=r.id;const link=el('a'),img=el('img');link.href=r.originalPath;link.target='_blank';img.src=r.originalPath;img.alt=r.title;img.loading='lazy';link.append(img);card.append(link);const d=el('div',null,'detail');d.append(el('h3',r.title));d.append(el('div',names[r.focus]||r.focus,'badge'));d.append(el('p',r.gridSize?`${r.gridSize.join(' × ')} 格${r.beadCount?' · '+r.beadCount+' 颗':''}`:`原图 ${r.imageSize.join(' × ')} 像素 · 格数见图纸`,'muted'));d.append(el('p','作者：'+(r.author||'未提供')));const a=el('a','来源页面 ↗');a.href=r.url;a.target='_blank';a.rel='noreferrer';d.append(a);if(r.tagsText)d.append(el('p',r.tagsText,'muted'));card.append(d);cards.append(card)}}
for(const e of [q,f,c,v,size])e.addEventListener(e===q?'input':'change',()=>render(true));prev.addEventListener('click',()=>{pageNumber--;render();window.scrollTo(0,0)});next.addEventListener('click',()=>{pageNumber++;render();window.scrollTo(0,0)});render();
</script>
</html>
